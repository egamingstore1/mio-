<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Tienda Gamer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --border-color: #334155;
            --accent-blue: #38bdf8;
            --status-green: #10b981;
            --status-red: #ef4444;
            --status-yellow: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 24px 16px;
        }

        .admin-container {
            max-width: 1150px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            color: var(--accent-blue);
            text-decoration: none;
            background: var(--card-bg);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: var(--accent-blue);
            color: var(--bg-dark);
        }

        .grid-config {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .card h3 {
            font-size: 1.1rem;
            color: var(--accent-blue);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        button.btn-main {
            background: var(--accent-blue);
            color: var(--bg-dark);
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s ease;
            white-space: nowrap;
        }

        button.btn-main:hover {
            opacity: 0.9;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: rgba(0, 0, 0, 0.2);
            color: var(--accent-blue);
            font-weight: 600;
        }

        .badge-status {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .status-procesando { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-aprobado { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-rechazado { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-act {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: transform 0.1s ease;
        }

        .btn-act:active {
            transform: scale(0.95);
        }

        .btn-approve { background: var(--status-green); color: #fff; }
        .btn-reject { background: var(--status-red); color: #fff; }

        code {
            background: var(--input-bg);
            padding: 3px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <header>
            <h1><i class="fa-solid fa-user-shield"></i> Panel Administrador</h1>
            <a href="index.html" class="btn-back"><i class="fa-solid fa-store"></i> Tienda</a>
        </header>

        <div class="grid-config">
            <div class="card">
                <h3><i class="fa-solid fa-dollar-sign"></i> Tasa USDT / Bolívares</h3>
                <p class="card-desc">Ajusta la tasa de cambio base para las recargas.</p>
                <div class="input-group">
                    <input type="number" id="tasaInput" placeholder="Ej: 885.00" step="0.01">
                    <button class="btn-main" onclick="guardarTasa()">Guardar</button>
                </div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-ticket"></i> Crear Cupón</h3>
                <p class="card-desc">Genera códigos de descuento para tus clientes.</p>
                <div class="input-group">
                    <input type="text" id="couponCode" placeholder="CÓDIGO">
                    <input type="number" id="couponDiscount" placeholder="% Desc" style="max-width: 90px;">
                    <button class="btn-main" onclick="guardarCupon()">Crear</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-list-check"></i> Órdenes de Recarga</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Cliente / ID Juego</th>
                            <th>Juego / Paquete</th>
                            <th>Referencia</th>
                            <th>Monto</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="pedidosTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarTasa();
            cargarPedidos();
        });

        window.addEventListener('storage', () => {
            cargarPedidos();
        });

        function cargarTasa() {
            const tasaGuardada = localStorage.getItem('tasaUSDT') || '885.00';
            document.getElementById('tasaInput').value = tasaGuardada;
        }

        function guardarTasa() {
            const nuevaTasa = document.getElementById('tasaInput').value;
            if (nuevaTasa && nuevaTasa > 0) {
                localStorage.setItem('tasaUSDT', nuevaTasa);
                alert('Tasa actualizada correctamente.');
            } else {
                alert('Ingresa una tasa válida.');
            }
        }

        function guardarCupon() {
            const codigo = document.getElementById('couponCode').value.trim().toUpperCase();
            const descuento = parseFloat(document.getElementById('couponDiscount').value);

            if (!codigo || isNaN(descuento)) {
                alert('Ingresa un código y un porcentaje válido.');
                return;
            }

            let cupones = JSON.parse(localStorage.getItem('cuponesStore')) || {};
            cupones[codigo] = descuento;
            localStorage.setItem('cuponesStore', JSON.stringify(cupones));

            alert(`Cupón "${codigo}" guardado.`);
            document.getElementById('couponCode').value = '';
            document.getElementById('couponDiscount').value = '';
        }

        function cargarPedidos() {
            const tbody = document.getElementById('pedidosTableBody');
            
            let ordenes = JSON.parse(localStorage.getItem('mis_compras')) || JSON.parse(localStorage.getItem('ordenesRecarga')) || [];

            if (ordenes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-sub); padding: 24px;">No hay órdenes registradas.</td></tr>`;
                return;
            }

            // INYECCIÓN DE ID ÚNICO ABSOLUTO
            // Garantiza que cada orden existente tenga una ID irrepetible en LocalStorage
            let huboNuevosIds = false;
            ordenes.forEach((ord, index) => {
                if (!ord._id_unico) {
                    ord._id_unico = 'ORD_' + Date.now() + '_' + index + '_' + Math.random().toString(36).substr(2, 9);
                    huboNuevosIds = true;
                }
            });

            if (huboNuevosIds) {
                const claves = ['mis_compras', 'ordenesRecarga', 'compras_clientes', 'historialPagos', 'pedidos'];
                claves.forEach(clave => {
                    if (localStorage.getItem(clave)) {
                        localStorage.setItem(clave, JSON.stringify(ordenes));
                    }
                });
            }

            tbody.innerHTML = '';

            ordenes.forEach((ord) => {
                const tr = document.createElement('tr');
                const ref = ord.ref || ord.referencia || ord.reference || 'S/R';
                const idJugador = ord.id || ord.playerId || ord.player_id || 'N/A';
                const usuario = ord.usuario || ord.idUsuario || 'Cliente';
                const juego = ord.juego || ord.game || 'Recarga';
                const paquete = ord.paquete || ord.package || 'Estándar';
                const monto = ord.monto || ord.totalBs || ord.montoBs || '0';
                const idUnico = ord._id_unico;

                let estado = (ord.estado || ord.status || 'procesando').toString().toLowerCase();
                let estadoMostrar = 'PROCESANDO';
                let claseEstado = 'status-procesando';

                if (estado === 'aprobado' || estado === 'completado' || estado === 'exitoso') {
                    estadoMostrar = 'APROBADO';
                    claseEstado = 'status-aprobado';
                } else if (estado === 'rechazado' || estado === 'negado' || estado === 'cancelado') {
                    estadoMostrar = 'RECHAZADO';
                    claseEstado = 'status-rechazado';
                }

                tr.innerHTML = `
                    <td>
                        <strong>${usuario}</strong><br>
                        <small style="color: var(--text-sub);">ID: ${idJugador}</small>
                    </td>
                    <td>${juego}<br><small style="color: var(--text-sub);">${paquete}</small></td>
                    <td><code>${ref}</code></td>
                    <td><strong>${monto} Bs</strong></td>
                    <td>
                        <span class="badge-status ${claseEstado}">${estadoMostrar}</span>
                    </td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-act btn-approve" onclick="cambiarEstadoPorIDUnico('${idUnico}', 'aprobado')" title="Aprobar">
                                <i class="fa-solid fa-check"></i>
                            </button>
                            <button class="btn-act btn-reject" onclick="cambiarEstadoPorIDUnico('${idUnico}', 'rechazado')" title="Rechazar">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // CAMBIO EXCLUSIVO MEDIANTE _id_unico
        function cambiarEstadoPorIDUnico(idUnicoObjetivo, nuevoEstado) {
            const claves = ['mis_compras', 'ordenesRecarga', 'compras_clientes', 'historialPagos', 'pedidos'];

            claves.forEach(clave => {
                let items = JSON.parse(localStorage.getItem(clave)) || [];
                if (Array.isArray(items) && items.length > 0) {
                    let modificado = false;

                    items = items.map(ord => {
                        // Solo modifica LA ORDEN EXACTA que coincide con el hash _id_unico
                        if (ord._id_unico === idUnicoObjetivo) {
                            ord.estado = nuevoEstado;
                            ord.status = nuevoEstado;
                            modificado = true;
                        }
                        return ord;
                    });

                    if (modificado) {
                        localStorage.setItem(clave, JSON.stringify(items));
                    }
                }
            });

            // Refresca la vista inmediatamente
            cargarPedidos();
        }
    </script>
</body>
</html>
